[workspace]
resolver = "3"
members = [
    "crates/termstate-core",
    "crates/termstate-store",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/linyiru/termstate"
homepage = "https://github.com/linyiru/termstate"
keywords = ["osc7501", "terminal", "program-status", "escape-sequence", "vt"]
categories = ["command-line-interface", "parser-implementations", "no-std"]

[workspace.dependencies]
termstate-core = { path = "crates/termstate-core", version = "0.0.1" }
termstate-store = { path = "crates/termstate-store", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
